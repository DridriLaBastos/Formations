management:
  endpoints:
    web:
      exposure:
        include: "*"

server:
  port: ${CONFIG_SERVER_PORT}

encrypt:
  key: ${CONFIG_SERVER_AES_KEY}

eureka:
  client:
    serviceUrl:
      defaultZone: "http://localhost:8761/eureka"
    register-with-eureka: true
    fetch-registry: true